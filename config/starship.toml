add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[character]
success_symbol = "[\uf1b0 ](bold white)"
error_symbol = "[\uf1b0 ](bold bright-black)"

[directory]
style = "bold white"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bright-black"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bright-black"
