general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(107, 107, 107, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 1.0)
    inner_color = rgba(0, 0, 0, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(107, 107, 107, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>Wrong password</i>
    rounding = 8
    position = 0, -20
    halign = center
    valign = center
}
